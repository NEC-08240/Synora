name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/pipeline/requirements-gateway.txt -r tools/pipeline/requirements-client.txt -r tools/pipeline/requirements-worker.txt
      - name: Syntax check
        run: python -m compileall -q tools/pipeline
      - name: Unit and integration tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest $(ls tools/pipeline/test_*.py | sed 's|/|.|g; s|\.py$||')

  merge-policy:
    name: merge-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -B -m tools.pipeline.merge_policy --base "$BASE_SHA" --head "$HEAD_SHA" > policy.json
          cat policy.json
          {
            echo "### Merge policy"
            echo '```json'
            cat policy.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
