name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway values for a disposable container; not real credentials.
      CI_SA_PASSWORD: Ci-only-${{ github.run_id }}-Aa1!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Start disposable SQL Server
        run: |
          docker run -d --name mssql -p 1433:1433 -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$CI_SA_PASSWORD" mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 40); do
            docker exec mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$CI_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker logs mssql; exit 1
      - name: Create and seed the test database
        run: |
          docker cp ../database mssql:/db
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$CI_SA_PASSWORD" -C -b -v DB_NAME=SynoraV1_Test -i /db/schema.sql
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$CI_SA_PASSWORD" -C -b -v DB_NAME=SynoraV1_Test -i /db/validate_schema.sql
          cat > .env.test <<EOF
          NODE_ENV=test
          DB_SERVER=localhost
          DB_PORT=1433
          DB_NAME=SynoraV1_Test
          DB_USER=sa
          DB_PASSWORD=$CI_SA_PASSWORD
          DB_TRUST_SERVER_CERT=true
          JWT_SECRET=$(openssl rand -hex 32)
          CORS_ORIGINS=http://localhost:5173
          SEED_PASSWORD=$(openssl rand -hex 12)
          ALLOW_SEED=1
          EOF
          npm run seed:test
      # The SQL sandbox suite needs a Windows-auth sysadmin sqlcmd, so it is skipped here and
      # still has to be run locally (backend/README.md); npm test, not test:ci, keeps it optional.
      - run: npm test
